[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asn-asset-mapper"
version = "1.0.0"
description = "Map the public network footprint of an ASN — passive ASN and public network asset mapping for defensive security research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mr Dinesh Pathro" },
]
keywords = [
    "asn",
    "bgp",
    "network-intelligence",
    "asset-discovery",
    "rdap",
    "whois",
    "certificate-transparency",
    "osint",
    "security",
    "reconnaissance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "dnspython>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mrdineshpathro-dot/ASNMapper"
Documentation = "https://github.com/mrdineshpathro-dot/ASNMapper#readme"
"Bug Tracker" = "https://github.com/mrdineshpathro-dot/ASNMapper/issues"
"Buy Me a Coffee" = "https://buymeacoffee.com/mrdineshpathro"

[project.scripts]
asn-mapper = "asn_mapper.cli:main"

[tool.setuptools.packages.find]
include = ["asn_mapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
